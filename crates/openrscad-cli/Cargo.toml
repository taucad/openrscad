[package]
name = "openrscad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openrscad"
path = "src/main.rs"

[dependencies]
openrscad-syntax = { workspace = true }
openrscad-eval = { workspace = true, features = ["system-fonts"] }
# `cpp-relation` links the C++ Manifold kernel (`ManifoldKernel`), which this
# crate names directly; it needs cmake and a C++ toolchain at build time.
openrscad-geom = { workspace = true, features = ["cpp-relation"] }
openrscad-ir = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
png = { workspace = true }

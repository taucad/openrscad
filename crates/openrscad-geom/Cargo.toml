[package]
name = "openrscad-geom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
benchmark-profile = ["dep:web-time"]
# Force the pure-Rust relation kernel on native targets so native and wasm
# serialize the same artifact (the wasm build is the reference semantics).
rust-relation = []
# Link the C++ Manifold kernel (`manifold-csg`), which is built from source and
# so needs cmake and a C++ toolchain. Off by default: with it the crate exposes
# `ManifoldKernel` and dispatches booleans and relations through C++; without it
# every path uses the pure-Rust `manifold-rust` port and the crate is pure Rust.
# `openrscad-cli`, `openrscad-lsp` and the desktop app enable it; `openrscad-napi`
# and `openrscad-wasm` do not, so neither needs cmake. Native-only — the
# dependency is absent on wasm32, so enabling it there will not compile.
cpp-relation = ["dep:manifold-csg"]

[dependencies]
openrscad-ir = { workspace = true }
thiserror = { workspace = true }
# Pure-Rust Manifold CSG kernel — builds on native and wasm32-unknown-unknown.
manifold-rust = "0.9.2"
# Robust polygon triangulation with holes (earcut) — for text glyphs / polygons.
earcutr = { workspace = true }
# 2D polygon boolean ops (union/difference/intersection) — for 2D CSG,
# projection silhouettes, etc. Pure-Rust, wasm-compatible.
geo = { workspace = true }
# DEFLATE decompression for 3MF import (ZIP entries are deflate-compressed).
miniz_oxide = { workspace = true }
libm = { workspace = true }
serde_json = "1"
web-time = { version = "1", optional = true }

# C++ Manifold kernel — native only (does not target wasm32-unknown-unknown) and
# built from source with cmake + a C++ toolchain, so it is opt-in via
# `cpp-relation`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
manifold-csg = { version = "0.3", optional = true }

[dev-dependencies]
roxmltree = "0.20"

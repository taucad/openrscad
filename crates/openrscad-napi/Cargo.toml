[package]
name = "openrscad-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# This addon is pure Rust. `openrscad-geom`'s `cpp-relation` feature is NOT
# enabled anywhere in this dependency chain, so `manifold-csg` (C++ Manifold +
# TBB, built from source with cmake) is not a dependency of a
# `cargo build -p openrscad-napi` at all — that is what lets the addon
# cross-compile without a C++ toolchain.
#
# `rust-relation` stays on top of that as an explicit pin: a native build that
# used the C++ relation kernel would serialize a structurally different artifact
# from the wasm build (different triangle partition, −10% surface area on
# boolean-heavy models), and the whole point of this addon is that it does not.
# The pin matters because Cargo unifies features per build: a
# `cargo build --workspace` also builds `openrscad-cli`, which does enable
# `cpp-relation`, and without this pin the shared `openrscad-geom` would hand
# this addon the C++ relation kernel.
#
# `openrscad-eval` is taken WITHOUT `system-fonts` so `text()` cannot pick up
# host fonts the browser has never heard of.
openrscad-api = { workspace = true, features = ["rust-relation"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

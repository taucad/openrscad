[package]
name = "openrscad-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
benchmark-profile = ["openrscad-api/benchmark-profile"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openrscad-api = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
# Test-only: the suite asserts on geometry primitives directly.
openrscad-geom = { workspace = true }
openrscad-syntax = { workspace = true }
serde_json = "1"
# Runs the crate's tests in a real browser via `wasm-pack test`, exercising the
# boolmesh-on-wasm kernel path that browsers actually execute.
wasm-bindgen-test = "0.3"
